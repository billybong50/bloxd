<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxd Portal</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        /* Animated Background */
        .voxel-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                repeating-linear-gradient(90deg, transparent, transparent 50px, #2c3e50 50px, #2c3e50 100px),
                repeating-linear-gradient(0deg, transparent, transparent 50px, #2c3e50 50px, #2c3e50 100px);
            background-size: 100% 100%, 100px 100px, 100px 100px;
            z-index: -1;
            animation: moveBg 20s linear infinite;
        }

        @keyframes moveBg {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 100px, 0 100px; }
        }

        h1 {
            position: absolute;
            top: 20px;
            text-align: center;
            font-size: 3rem;
            text-shadow: 4px 4px 0px #000;
            letter-spacing: 2px;
            z-index: 10;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 800px;
            padding: 20px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        /* Hide grid when iframe is active */
        .grid-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* The Portal Buttons */
        .portal-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 20px;
            border: 4px solid #000;
            border-radius: 12px;
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
            min-height: 100px;
            text-align: center;
            
            /* Minecraft-like Button Style */
            background-color: #7d7d7d;
            box-shadow: inset 4px 4px 0px #a8a8a8, inset -4px -4px 0px #4a4a4a, 0px 8px 0px #000;
        }

        .portal-btn:hover {
            transform: translateY(4px);
            box-shadow: inset 4px 4px 0px #a8a8a8, inset -4px -4px 0px #4a4a4a, 0px 4px 0px #000;
            filter: brightness(1.1);
        }

        .portal-btn:active {
            transform: translateY(8px);
            box-shadow: inset 4px 4px 0px #4a4a4a, inset -4px -4px 0px #a8a8a8, 0px 0px 0px #000;
        }

        /* Specific Colors for variety */
        .p1 { background-color: #3498db; box-shadow: inset 4px 4px 0px #5dade2, inset -4px -4px 0px #2874a6, 0px 8px 0px #000; }
        .p2 { background-color: #e74c3c; box-shadow: inset 4px 4px 0px #ec7063, inset -4px -4px 0px #c0392b, 0px 8px 0px #000; }
        .p3 { background-color: #2ecc71; box-shadow: inset 4px 4px 0px #58d68d, inset -4px -4px 0px #27ae60, 0px 8px 0px #000; }
        .p4 { background-color: #9b59b6; box-shadow: inset 4px 4px 0px #bb8fce, inset -4px -4px 0px #8e44ad, 0px 8px 0px #000; }
        .p5 { background-color: #f1c40f; box-shadow: inset 4px 4px 0px #f7dc6f, inset -4px -4px 0px #d4ac0d, 0px 8px 0px #000; }
        .p6 { background-color: #e67e22; box-shadow: inset 4px 4px 0px #eb984e, inset -4px -4px 0px #ca6f1e, 0px 8px 0px #000; }

        .label {
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 5px;
        }
        
        .link-text {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Iframe Styling */
        #game-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 20;
            display: none; /* Hidden by default */
        }

        /* Back Arrow Button */
        #back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 30;
            background-color: #333;
            color: white;
            border: 2px solid #fff;
            padding: 10px 15px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 4px 0 #000;
            display: none; /* Hidden by default */
            font-weight: bold;
        }

        #back-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }
    </style>
</head>
<body>

    <div class="voxel-bg"></div>
    
    <h1>BLOXD PORTAL</h1>

    <div class="grid-container" id="menu-grid">
        <!-- Button 1 -->
        <button onclick="loadGame('https://buildhub.work')" class="portal-btn p1">
            <span class="label">Portal 1</span>
            <span class="link-text">Working</span>
        </button>

        <!-- Button 2 -->
        <button onclick="loadGame('https://buildhub.club')" class="portal-btn p2">
            <span class="label">Portal 2</span>
            <span class="link-text">Working</span>
        </button>

        <!-- Button 3 -->
        <button onclick="loadGame('https://classcraft.space')" class="portal-btn p3">
            <span class="label">Portal 3</span>
            <span class="link-text">Working</span>
        </button>

        <!-- Button 4 -->
        <button onclick="loadGame('https://buildminecreate.com')" class="portal-btn p4">
            <span class="label">Portal 4</span>
            <span class="link-text">Working</span>
        </button>

        <!-- Button 5 -->
        <button onclick="loadGame('https://iogamesunblocked.com')" class="portal-btn p5">
            <span class="label">Portal 5</span>
            <span class="link-text">Down</span>
        </button>

        <!-- Button 6 -->
        <button onclick="loadGame('https://doodlecube.io')" class="portal-btn p6">
            <span class="label">Portal 6</span>
            <span class="link-text">Working</span>
        </button>
    </div>

    <!-- Iframe Container -->
    <iframe id="game-frame" src=""></iframe>

    <!-- Back/Arrow Button -->
    <button id="back-btn" onclick="goHome()">&#8592; HOME</button>

    <script>
        const frame = document.getElementById('game-frame');
        const grid = document.getElementById('menu-grid');
        const backBtn = document.getElementById('back-btn');

        function loadGame(url) {
            // Show iframe and hide menu
            frame.src = url;
            frame.style.display = 'block';
            grid.classList.add('hidden');
            backBtn.style.display = 'block';
        }

        function goHome() {
            // Clear iframe and show menu
            frame.src = "";
            frame.style.display = 'none';
            grid.classList.remove('hidden');
            backBtn.style.display = 'none';
        }
    </script>

</body>
</html>
